<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly Chart</title>
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
</head>

<body>
    <div id="chart1" style="width: 80%; margin: auto;"></div>
    <!-- <script>Plotly.newPlot('chart1', {{ graphJSON1 | safe }}.data, {{ graphJSON1 | safe }}.layout);</script> -->

    <div id="chart2" style="width: 80%; margin: auto;"></div>
    <!-- <script>Plotly.newPlot('chart2', {{ graphJSON2 | safe }}.data, {{ graphJSON2 | safe }}.layout);</script> -->

    <div id="chart3" style="width: 80%; margin: auto;"></div>
    <!-- <script>Plotly.newPlot('chart3', {{ graphJSON3 | safe }}.data, {{ graphJSON3 | safe }}.layout);</script> -->

    <div id="chart4" style="width: 80%; margin: auto;"></div>
    <!-- <script>Plotly.newPlot('chart4', {{ graphJSON4 | safe }}.data, {{ graphJSON4 | safe }}.layout);</script> -->

    <div id="chart5" style="width: 80%; margin: auto;"></div>
    <!-- <script>Plotly.newPlot('chart5', {{ graphJSON5 | safe }}.data, {{ graphJSON5 | safe }}.layout);</script> -->
    <script>
        async function loadCharts() {
            const response = await fetch('/get_charts');
            const data = await response.json();

            Plotly.react('chart1', data.chart1.data, data.chart1.layout);
            Plotly.react('chart2', data.chart2.data, data.chart2.layout);
            Plotly.react('chart3', data.chart3.data, data.chart3.layout);
            Plotly.react('chart4', data.chart4.data, data.chart4.layout);
            Plotly.react('chart5', data.chart5.data, data.chart5.layout);
        }
        loadCharts();
        setInterval(loadCharts, 5000);
    </script>


</body>

</html>
