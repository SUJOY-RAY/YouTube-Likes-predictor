<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Live Video Data</h1>
    <table id="videoTable">
        <thead>
            <tr>
                <th>Video Title</th>
                <th>Views</th>
                <th>Days Ago</th>
                <th>Products</th>
                <th>Likes</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <script>
        function fetchData() {
            fetch("/get_data")
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector("#videoTable tbody");
                    tableBody.innerHTML = ""; // Clear previous data

                    data.forEach(video => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${video["video title"]}</td>
                            <td>${video.views}</td>
                            <td>${video["days ago"]}</td>
                            <td>${video.products}</td>
                            <td>${video.likes}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                });
        }

        // Fetch data initially and then every 2 seconds
        fetchData();
        setInterval(fetchData, 2000);
    </script>

</body>
</html>
